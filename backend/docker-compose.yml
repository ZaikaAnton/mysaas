version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: saas-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hrtech_saas

volumes:
  postgres_data:

networks:
  hrtech_saas:
